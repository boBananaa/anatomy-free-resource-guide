<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy Free Resource Guide</title>
<style>
:root{
  --bg:#f4f6fb;--fg:#17181c;--mut:#6a6f7c;--card:#ffffff;--bd:#e4e7ef;--soft:#f0f3fa;
  --ac:#4f6ef7;--ac2:#8b5cf6;--ok:#17a673;--bad:#e5484d;--vid:#e8590c;--shadow:0 1px 2px rgba(20,24,40,.05),0 6px 20px rgba(20,24,40,.05)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1117;--fg:#eceef5;--mut:#9aa0b2;--card:#171a23;--bd:#262a38;--soft:#1d2130;
  --ac:#7b92ff;--ac2:#a78bfa;--ok:#3ccf91;--bad:#ff6b70;--vid:#ff9a52;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25)
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:0 16px 70px}
header{padding:34px 0 18px}
h1{font-size:28px;letter-spacing:-.02em;margin:0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:6px 0 0;font-size:14px}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flow span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--mut)}
.flow b{color:var(--ac)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat strong{font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--mut);font-size:13px}
.overall{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:999px;transition:width .35s ease}
.tools{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.ghost{background:none;color:var(--mut);border:1px solid var(--bd);border-radius:9px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.ghost:hover{color:var(--fg);border-color:var(--mut)}

.unit{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.uh{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.uh:hover{background:var(--soft)}
.badge{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.uh .t{flex:1;min-width:0}
.uh .t b{display:block;font-size:16px;letter-spacing:-.01em}
.meta{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
.chev{flex:none;color:var(--mut);transition:transform .2s}
.unit.open .chev{transform:rotate(90deg)}
.ub{display:none;padding:2px 16px 16px;border-top:1px solid var(--bd)}
.unit.open .ub{display:block}

.ch{margin-top:16px;padding:14px;background:var(--soft);border-radius:12px}
.ch h3{margin:0 0 10px;font-size:15px;letter-spacing:-.01em}
.step{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff}
.step.w{color:var(--vid)}.step.w i{background:var(--vid)}
.step.r{color:var(--ac)}.step.r i{background:var(--ac)}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:9px;transition:background .15s}
.item:hover{background:var(--card)}
.item input{margin-top:4px;width:16px;height:16px}
.item.v input{accent-color:var(--vid)}
.item.l input{accent-color:var(--ac)}
.item a{color:var(--fg);text-decoration:none;flex:1}
.item a:hover{color:var(--ac)}
.item.v a:hover{color:var(--vid)}
.item.done a{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--bd)}
.go{font-size:12px;color:var(--mut);white-space:nowrap}
.foot{display:flex;justify-content:flex-end;margin-top:14px;align-items:center;gap:10px}
.foot .step{margin:0 auto 0 0}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}

#quiz{display:none;position:fixed;inset:0;background:rgba(10,12,20,.6);backdrop-filter:blur(3px);overflow:auto;padding:16px;z-index:10}
#quiz .box{max-width:720px;margin:24px auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
#quiz h2{margin:0;letter-spacing:-.01em}
.q{margin:20px 0}
.q p{margin:0 0 8px;font-weight:600}
.q label{display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer;transition:border-color .15s,background .15s}
.q label:hover{border-color:var(--ac)}
.q label.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.q label.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.why{font-size:13px;color:var(--mut);margin:6px 2px 0}
#score{margin-right:auto;font-weight:700}
.tp{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.tp>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;background:none;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.tp>button:hover{background:var(--soft)}
.tp .tb{display:none;padding:0 16px 16px;border-top:1px solid var(--bd)}
.tp.open .tb{display:block}
.tp h4{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tc{display:block;text-decoration:none;color:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--soft);transition:border-color .15s,transform .15s}
.tc:hover{border-color:var(--ac);transform:translateY(-1px)}
.tc b{display:block;font-size:14px}
.tc span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.tc em{font-style:normal;font-size:11px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 0;font-size:12px;color:var(--mut)}
.chips a{text-decoration:none;color:var(--ac);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;background:var(--soft)}
.chips a:hover{border-color:var(--ac)}
@media(max-width:560px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Anatomy Free Resource Guide</h1>
    <p class="sub">Free videos, the free OpenStax textbook, quizzes and study tools in one place. Progress saves in this browser only.</p>
    <div class="flow"><span><b>1</b> Watch</span><span><b>2</b> Read</span><span><b>3</b> Quiz the unit</span></div>
  </header>
  <div class="stats">
    <div class="stat"><small>Watched</small><strong id="sv">0</strong> <span id="svt"></span></div>
    <div class="stat"><small>Read</small><strong id="sl">0</strong> <span id="slt"></span></div>
    <div class="stat"><small>Quizzes</small><strong id="sq">0</strong> <span id="sqt"></span></div>
  </div>
  <div class="overall">
    <div class="row" style="margin-bottom:8px"><span id="overall" style="font-weight:600"></span><span id="pct" style="color:var(--mut)"></span></div>
    <div class="bar"><i id="obar"></i></div>
    <div class="tools"><button class="ghost" id="exp">Export</button><button class="ghost" id="imp">Import</button><button class="ghost" id="rst">Reset</button></div>
  </div>
  <div id="tools"></div>
  <div id="units"></div>
</main>
<div id="quiz"><div class="box" id="qbox"></div></div>
<input type="file" id="file" accept="application/json" style="display:none">

const TOOLMAP = {"1": ["histology", "innerbody", "anki", "khan"], "2": ["biodigital", "zygote", "bp3d", "anatomyzone"], "3": ["biodigital", "zygote", "teachme"], "4": ["biodigital", "innerbody", "kenhub"], "5": ["biodigital", "innerbody", "teachme"], "6": ["biodigital", "teachme", "khan"]};
const TOOLBY = Object.fromEntries(TOOLS.flatMap(g => g.items).map(t => [t.id, t]));
const KEY = "anatomy-tracker-v1";
let S = load();
function load(){ try { const o = JSON.parse(localStorage.getItem(KEY) || "{}"); return {done:o.done||{}, vids:o.vids||{}, best:o.best||{}, open:o.open||{}}; } catch(_) { return {done:{},vids:{},best:{},open:{}}; } }
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lessonsOf = u => u.chapters.flatMap(c => c.lessons);
const vidsOf = u => u.chapters.flatMap(c => c.videos.map((v, i) => ({...v, id: "v" + c.num + "-" + i})));

function renderTools() {
  $("#tools").innerHTML = `<div class="tp ${S.open.tools ? "open" : ""}"><button data-tools aria-expanded="${!!S.open.tools}">Free study tools: 3D models, histology, flashcards <span class="chev">&#9656;</span></button>
    <div class="tb">${TOOLS.map(g => `<h4>${esc(g.group)}</h4><div class="tg">${g.items.map(t =>
      `<a class="tc" href="${t.url}" target="_blank" rel="noopener"><em>${esc(t.cost)}</em><b>${esc(t.name)} &#8599;</b><span>${esc(t.note)}</span></a>`).join("")}</div>`).join("")}</div></div>`;
}
$("#tools").addEventListener("click", e => { if (e.target.closest("[data-tools]")) { S.open.tools = !S.open.tools; save(); renderTools(); } });

function render() {
  renderTools();
  let L = 0, Ld = 0, V = 0, Vd = 0;
  const html = UNITS.map(u => {
    const ls = lessonsOf(u), vs = vidsOf(u);
    const ld = ls.filter(l => S.done[l.id]).length, vd = vs.filter(v => S.vids[v.id]).length;
    L += ls.length; Ld += ld; V += vs.length; Vd += vd;
    const all = ls.length + vs.length, dn = ld + vd, best = S.best[u.id];
    const chs = u.chapters.map(c => {
      const vids = c.videos.map((v, i) => { const id = "v" + c.num + "-" + i; return `
        <div class="item v ${S.vids[id] ? "done" : ""}"><input type="checkbox" data-vid="${id}" ${S.vids[id] ? "checked" : ""} aria-label="Mark video watched">
        <a href="${v.url}" target="_blank" rel="noopener">${esc(v.label)}</a><span class="go">YouTube &#8599;</span></div>`; }).join("");
      const les = c.lessons.map(l => `
        <div class="item l ${S.done[l.id] ? "done" : ""}"><input type="checkbox" data-id="${l.id}" ${S.done[l.id] ? "checked" : ""} aria-label="Mark ${l.id} read">
        <a href="${l.url}" target="_blank" rel="noopener">${l.id} ${esc(l.title)}</a><span class="go">OpenStax &#8599;</span></div>`).join("");
      return `<div class="ch"><h3>Chapter ${c.num}: ${esc(c.title)}</h3>
        ${vids ? `<div class="step w"><i>1</i>Watch first</div>${vids}` : ""}
        <div class="step r"><i>${vids ? 2 : 1}</i>Then read</div>${les}</div>`;
    }).join("");
    return `<section class="unit ${S.open[u.id] ? "open" : ""}">
      <button class="uh" data-toggle="${u.id}" aria-expanded="${!!S.open[u.id]}">
        <div class="badge">${u.id}</div>
        <div class="t"><b>${esc(u.title)}</b>
          <div class="meta">${vd}/${vs.length} watched &middot; ${ld}/${ls.length} read${best != null ? " &middot; quiz best " + best + "/10" : ""}</div>
          <div class="bar"><i style="width:${all ? dn / all * 100 : 0}%"></i></div></div>
        <span class="chev">&#9656;</span>
      </button>
      <div class="ub">${(TOOLMAP[u.id] || []).length ? `<div class="chips">Explore this unit: ${TOOLMAP[u.id].map(id => `<a href="${TOOLBY[id].url}" target="_blank" rel="noopener">${esc(TOOLBY[id].name)} &#8599;</a>`).join("")}</div>` : ""}${chs}
        <div class="foot"><div class="step r" style="color:var(--ac)"><i>3</i>Then quiz</div><button class="btn" data-quiz="${u.id}">Take the 10-question quiz</button></div>
      </div></section>`;
  }).join("");
  $("#units").innerHTML = html;
  const tot = L + V, dn = Ld + Vd, qn = UNITS.filter(u => S.best[u.id] != null).length;
  $("#sv").textContent = Vd; $("#svt").textContent = "of " + V + " videos";
  $("#sl").textContent = Ld; $("#slt").textContent = "of " + L + " lessons";
  $("#sq").textContent = qn; $("#sqt").textContent = "of " + UNITS.length + " units";
  $("#overall").textContent = dn + " of " + tot + " steps done";
  $("#pct").textContent = (tot ? Math.round(dn / tot * 100) : 0) + "%";
  $("#obar").style.width = (tot ? dn / tot * 100 : 0) + "%";
}

$("#units").addEventListener("click", e => {
  const t = e.target;
  if (t.matches("input[data-id]")) { S.done[t.dataset.id] = t.checked; save(); render(); return; }
  if (t.matches("input[data-vid]")) { S.vids[t.dataset.vid] = t.checked; save(); render(); return; }
  const qz = t.closest("[data-quiz]");
  if (qz) { openQuiz(+qz.dataset.quiz); return; }
  const tg = t.closest("[data-toggle]");
  if (tg) { const id = tg.dataset.toggle; S.open[id] = !S.open[id]; save(); render(); }
});

function openQuiz(uid) {
  const u = UNITS.find(x => x.id === uid);
  $("#quiz").style.display = "block";
  $("#qbox").innerHTML = `<h2>Unit ${u.id} quiz</h2><p class="sub">${esc(u.title)}</p>` +
    u.quiz.map((q, i) => `<div class="q"><p>${i + 1}. ${esc(q.q)}</p>${q.o.map((o, j) =>
      `<label><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join("")}<div class="why" id="w${i}"></div></div>`).join("") +
    `<div class="foot"><span id="score"></span><button class="ghost" id="qclose">Close</button><button class="btn" id="qsub">Check answers</button></div>`;
  $("#qclose").onclick = () => { $("#quiz").style.display = "none"; };
  $("#qsub").onclick = () => {
    let sc = 0, un = 0;
    u.quiz.forEach((q, i) => {
      const sel = document.querySelector(`input[name=q${i}]:checked`);
      document.querySelectorAll(`input[name=q${i}]`).forEach(r => { r.disabled = true; const l = r.parentElement; if (+r.value === q.a) l.classList.add("ok"); else if (r.checked) l.classList.add("no"); });
      if (!sel) un++; else if (+sel.value === q.a) sc++;
      $("#w" + i).textContent = q.e;
    });
    $("#score").textContent = `Score: ${sc}/10` + (un ? ` (${un} unanswered)` : "");
    if (S.best[u.id] == null || sc > S.best[u.id]) S.best[u.id] = sc;
    save(); render(); $("#qsub").disabled = true;
  };
}
$("#exp").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type: "application/json"})); a.download = "anatomy-progress.json"; a.click(); };
$("#imp").onclick = () => $("#file").click();
$("#file").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); S = {done:o.done||{}, vids:o.vids||{}, best:o.best||{}, open:o.open||{}}; save(); render(); } catch (_) { alert("That file didn't look right."); } }); };
$("#rst").onclick = () => { if (confirm("Reset all progress?")) { S = {done:{},vids:{},best:{},open:{}}; save(); render(); } };
render();
</script>
</body>
</html>
